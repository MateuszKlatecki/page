<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6c5ce7" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tabliczka Math" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <title>Mnożenie i Dzielenie 🌟</title>
</head>
<body>

<!-- ═══════════════════════ START SCREEN ═══════════════════════ -->
<div class="card">

  <div id="screen-start" class="screen active">
    <span class="emoji">🌟</span>
    <h1>Mnożenie i Dzielenie</h1>
    <p>Ćwicz oba działania. Wpisz wynik i naciśnij <strong>Enter</strong>.</p>

    <div class="settings">
      <div class="settings-row">
        <label for="cfg-max-result">🎯 Maksymalna liczba</label>
        <input class="setting-input" type="number" id="cfg-max-result"
               min="10" max="100" value="100" />
      </div>
      <div class="settings-row">
        <label for="cfg-total">🔢 Liczba zadań</label>
        <input class="setting-input" type="number" id="cfg-total"
               min="5" max="50" value="20" />
      </div>
      <div class="settings-row">
        <label>📐 Typ zadań</label>
        <div class="type-toggles">
          <label class="type-toggle">
            <input type="checkbox" id="cfg-multiply" checked />
            <span>✖ Mnożenie</span>
          </label>
          <label class="type-toggle">
            <input type="checkbox" id="cfg-divide" checked />
            <span>÷ Dzielenie</span>
          </label>
        </div>
      </div>
      <p class="pairs-hint" id="pairs-hint">Dostępnych zadań: <span id="pairs-count">162</span></p>
      <p class="type-error hidden" id="type-error">⚠ Zaznacz co najmniej jeden typ zadań!</p>
    </div>

    <button class="btn btn-primary" id="btn-start">▶ Start!</button>
  </div>

  <!-- ═══════════════════════ GAME SCREEN ═══════════════════════ -->
  <div id="screen-game" class="screen">
    <p class="progress-label" id="progress-label">Zadanie 1 / 20</p>
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar" style="width:0%"></div>
    </div>

    <div class="task" id="task-display">? ? ? = </div>

    <div>
      <input
        class="answer-input"
        type="number"
        id="answer-input"
        min="1" max="100"
        autocomplete="off"
        inputmode="numeric"
        placeholder="?"
      />
    </div>

    <div class="feedback hidden" id="feedback"></div>

    <button class="btn btn-check" id="btn-check">✔ Sprawdź</button>
  </div>

  <!-- ═══════════════════════ RESULTS SCREEN ═══════════════════════ -->
  <div id="screen-results" class="screen">
    <span class="emoji" id="results-emoji">🏆</span>
    <h2>Koniec gry!</h2>

    <div class="stats-grid">
      <div class="stat-box time">
        <div class="stat-value" id="stat-time">0s</div>
        <div class="stat-label">⏱ Czas</div>
      </div>
      <div class="stat-box ok">
        <div class="stat-value" id="stat-correct">0</div>
        <div class="stat-label">✅ Poprawne</div>
      </div>
      <div class="stat-box wrong">
        <div class="stat-value" id="stat-wrong">0</div>
        <div class="stat-label">❌ Błędne</div>
      </div>
    </div>

    <p id="results-message"></p>
    <section class="results-review" id="results-review" hidden>
      <h3>📝 Sprawdź błędne odpowiedzi</h3>
      <ul class="results-review-list" id="results-review-list"></ul>
    </section>
    <button class="btn btn-success" id="btn-restart">🔄 Zagraj ponownie</button>
  </div>

</div><!-- .card -->

<script src="app.js" defer></script>
</body>
</html>
